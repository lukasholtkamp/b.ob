### ekf config file ###
ekf_filter_node:
  ros__parameters:
    use_sim_time: False

    frequency: 15.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: false
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /diffbot_base_controller/odom

    imu0: /imu_broadcaster/imu

    use_control: false

    publish_tf: true


# If you're having trouble, try setting this to true, and then echo the /diagnostics_agg topic to see if the node is
# unhappy with any settings or data.
    # print_diagnostics: true
    
    publish_acceleration: false
    reset_on_time_jump: true


    odom0_config: [false, false, false,
                  false, false, false,
                  true, true, false, 
                  false, false, true,
                  false, false, false]


    #        [x_pos   , y_pos    , z_pos,
    #         roll    , pitch    , yaw,
    #         x_vel   , y_vel    , z_vel,
    #         roll_vel, pitch_vel, yaw_vel,
    #         x_accel , y_accel  , z_accel]

    odom0_queue_size: 2
    odom0_nodelay: false
    odom0_differential: false


    imu0_config: [false, false, false,  # x, y, z position (typically false for 2D localization)
              false, false, false,  # roll, pitch, yaw orientation (set true for yaw if needed)
              false, false, false,  # x, y, z linear velocity
              false, false, true,   # roll, pitch, yaw angular velocity
              true, true, true]     # x, y, z linear acceleration

    imu0_differential: false

    #        [x_pos   , y_pos    , z_pos,
    #         roll    , pitch    , yaw,
    #         x_vel   , y_vel    , z_vel,
    #         roll_vel, pitch_vel, yaw_vel,
    #         x_accel , y_accel  , z_accel]
    
